<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contactez Mehdi Lrhoula pour échanger autour d'une opportunité professionnelle, d'une alternance ou d'un projet.">

    <title>Contact | Mehdi Lrhoula</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="projets.html">Mes projets</a>
            <a href="competences.html">Mes compétences</a>
            <a href="experiences.html">Mes expériences</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section class="page-contact">

            <div class="titre-page">
                <h1>Me contacter</h1>

                <p>
                    Une opportunité, un projet ou simplement envie d'échanger ?
                    Vous pouvez me contacter à l'aide du formulaire ci-dessous.
                </p>
            </div>
            <div class="contact-direct">
                <p>
                    Vous pouvez également me contacter directement par e-mail :
                    <a href="mailto:mehdi.lrhoula@epitech.eu">
                        mehdi.lrhoula@epitech.eu
                    </a>
                </p>
            </div>
            <form class="formulaire-contact" id="formulaire-contact">

                <div class="champ-formulaire">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <div class="champ-formulaire">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="champ-formulaire">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <button type="submit">Envoyer le message</button>

            </form>

        </section>

    </main>
    <script src="js/contact.js"></script>
</body>

</html>
